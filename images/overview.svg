<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="230" viewBox="0 0 1000 230" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1000" height="230" fill="#ffffff"/>
  <text x="500" y="32" text-anchor="middle" font-size="20" font-weight="700" fill="#1f2328">The whole job in 5 steps</text>
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#8c959f"/>
    </marker>
  </defs>
  <g font-size="14" fill="#1f2328" text-anchor="middle">
    <rect x="20"  y="60" width="170" height="130" rx="12" fill="#eef4ff" stroke="#0969da" stroke-width="2"/>
    <text x="105" y="92" font-size="28" font-weight="700" fill="#0969da">1</text>
    <text x="105" y="122" font-weight="600">Check your</text>
    <text x="105" y="142" font-weight="600">versions</text>
    <text x="105" y="168" font-size="12" fill="#57606a">Red menu, 5 min</text>

    <rect x="215" y="60" width="170" height="130" rx="12" fill="#eef4ff" stroke="#0969da" stroke-width="2"/>
    <text x="300" y="92" font-size="28" font-weight="700" fill="#0969da">2</text>
    <text x="300" y="122" font-weight="600">Update MMI</text>
    <text x="300" y="142" font-weight="600">firmware</text>
    <text x="300" y="168" font-size="12" fill="#57606a">SD card, ~45-90 min</text>

    <rect x="410" y="60" width="170" height="130" rx="12" fill="#eef4ff" stroke="#0969da" stroke-width="2"/>
    <text x="495" y="92" font-size="28" font-weight="700" fill="#0969da">3</text>
    <text x="495" y="122" font-weight="600">Update Virtual</text>
    <text x="495" y="142" font-weight="600">Cockpit</text>
    <text x="495" y="168" font-size="12" fill="#57606a">TT / R8 only, if needed</text>

    <rect x="605" y="60" width="170" height="130" rx="12" fill="#eef4ff" stroke="#0969da" stroke-width="2"/>
    <text x="690" y="92" font-size="28" font-weight="700" fill="#0969da">4</text>
    <text x="690" y="122" font-weight="600">Install M.I.B.</text>
    <text x="690" y="142" font-weight="600">+ run the patch</text>
    <text x="690" y="168" font-size="12" fill="#57606a">SD card, ~20 min</text>

    <rect x="800" y="60" width="180" height="130" rx="12" fill="#e9f7ef" stroke="#1a7f37" stroke-width="2"/>
    <text x="890" y="92" font-size="28" font-weight="700" fill="#1a7f37">5</text>
    <text x="890" y="122" font-weight="600">Plug in phone</text>
    <text x="890" y="142" font-weight="600">and drive</text>
    <text x="890" y="168" font-size="12" fill="#57606a">CarPlay / Android Auto</text>
  </g>
  <g stroke="#8c959f" stroke-width="2" marker-end="url(#arr)">
    <line x1="191" y1="125" x2="212" y2="125"/>
    <line x1="386" y1="125" x2="407" y2="125"/>
    <line x1="581" y1="125" x2="602" y2="125"/>
    <line x1="776" y1="125" x2="797" y2="125"/>
  </g>
  <text x="500" y="215" text-anchor="middle" font-size="12" fill="#57606a">No laptop in the car, no VCDS / OBDeleven, no paid service needed: only SD cards and the buttons in your car.</text>
</svg>
